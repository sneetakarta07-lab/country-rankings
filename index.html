<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Web Ranking Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-10 px-6 py-4">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-chart-line text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-tight">Popunder Traffic Intelligence</h1>
            </div>
            <div id="lastUpdated" class="text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                Loading update time...
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 mt-8">

        <!-- Controls Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- Country Selector -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Select Country / Geo</label>
                <select id="countrySelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Loading Countries...</option>
                </select>
            </div>

            <!-- Search Domain -->
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Filter or Search Domain</label>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Type domain name (e.g. google, bet, stream)..." 
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 pr-10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-slate-400"></i>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl overflow-hidden shadow-2xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-950/60 border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
                        <th class="py-4 px-6 w-24">Rank</th>
                        <th class="py-4 px-6">Domain</th>
                        <th class="py-4 px-6 text-right">Direct Link</th>
                    </tr>
                </thead>
                <tbody id="rankingTable" class="divide-y divide-slate-700/50 text-sm">
                    <tr>
                        <td colspan="3" class="text-center py-10 text-slate-400">Fetching rankings data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <script>
        let fullData = null;
        let currentCountry = "GLOBAL";

        async function init() {
            try {
                const res = await fetch('data.json');
                fullData = await res.json();

                document.getElementById('lastUpdated').innerText = `Last Updated: ${fullData.updated_at || 'Recently'}`;

                // Populate Country Select
                const select = document.getElementById('countrySelect');
                select.innerHTML = fullData.countries.map(c => 
                    `<option value="${c.code}">${c.name} (${c.code})</option>`
                ).join('');

                renderRankings();
            } catch (err) {
                document.getElementById('rankingTable').innerHTML = `
                    <tr><td colspan="3" class="text-center py-10 text-rose-400">Failed to load data.json. Ensure it exists in root.</td></tr>
                `;
            }
        }

        function renderRankings() {
            if (!fullData) return;
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const list = fullData.rankings[currentCountry] || [];

            const filtered = list.filter(item => item.domain.toLowerCase().includes(query));
            const tbody = document.getElementById('rankingTable');

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-10 text-slate-400">No websites found matching your search.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-slate-700/30 transition-colors">
                    <td class="py-3.5 px-6 font-mono font-bold ${item.rank <= 3 ? 'text-amber-400' : 'text-blue-400'}">
                        #${item.rank}
                    </td>
                    <td class="py-3.5 px-6 font-medium text-slate-200">
                        ${item.domain}
                    </td>
                    <td class="py-3.5 px-6 text-right">
                        <a href="https://${item.domain}" target="_blank" rel="noopener noreferrer" 
                           class="text-xs text-slate-400 hover:text-blue-400 transition-colors inline-flex items-center gap-1.5 bg-slate-900/60 px-2.5 py-1 rounded border border-slate-700">
                            Visit <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('countrySelect').addEventListener('change', (e) => {
            currentCountry = e.target.value;
            renderRankings();
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            renderRankings();
        });

        init();
    </script>
</body>
</html>
